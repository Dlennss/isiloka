server {
    listen 80;
    server_name isiloka.com www.isiloka.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/isiloka;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://isiloka.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.isiloka.com;

    ssl_certificate /etc/letsencrypt/live/isiloka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isiloka.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://isiloka.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name isiloka.com;

    ssl_certificate /etc/letsencrypt/live/isiloka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isiloka.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:33128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
