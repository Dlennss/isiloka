name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'

    env:
      SERVER_HOST: "103.31.39.97"
      SERVER_PORT: "22"
      SERVER_USER: root
      BACKEND_SOURCE_DIR: pulsa-be
      FRONTEND_SOURCE_DIR: pulsa-fe
      FRONTEND_RELEASE_DIR: /home/mitra-p24/hit/Isiloka/deployment/staging/frontend
      BACKEND_RELEASE_DIR: /home/mitra-p24/hit/Isiloka/deployment/staging/pulsa-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SERVER_HOST" != "103.31.39.97" ] || [ "$SERVER_PORT" != "22" ] || [ "$SERVER_USER" != "root" ]; then
            echo "::error::The workflow target does not match the pinned Isiloka server."
            exit 1
          fi
          if [ "$BACKEND_SOURCE_DIR" != "pulsa-be" ] || [ "$FRONTEND_SOURCE_DIR" != "pulsa-fe" ]; then
            echo "::error::Source directories must be pulsa-be and pulsa-fe relative to the repository."
            exit 1
          fi
          if [ "$FRONTEND_RELEASE_DIR" != "/home/mitra-p24/hit/Isiloka/deployment/staging/frontend" ]; then
            echo "::error::The workflow must use the dedicated Isiloka staging directory (see ops/DEPLOY.md)."
            exit 1
          fi
          if [ ! -f "${BACKEND_SOURCE_DIR}/go.sum" ]; then
            echo "::error::BACKEND_SOURCE_DIR must point to the backend folder in this repository, for example: pulsa-be"
            exit 1
          fi
          if [ ! -f "${FRONTEND_SOURCE_DIR}/package-lock.json" ]; then
            echo "::error::FRONTEND_SOURCE_DIR must point to the frontend folder in this repository, for example: pulsa-fe"
            exit 1
          fi

      - name: Install SSH tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      - name: Configure deployment SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::Add SERVER_SSH_KEY. The new server does not accept SSH passwords."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/isiloka_deploy"
          ssh-keygen -y -P '' -f "$HOME/.ssh/isiloka_deploy" > /dev/null

      - name: Check restored services before building or uploading
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/isiloka_deploy" -p "$SERVER_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=ops/isiloka-known-hosts \
            "${SERVER_USER}@${SERVER_HOST}" '/usr/local/sbin/isiloka-activate --check'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache-dependency-path: pulsa-be/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          cache: npm
          cache-dependency-path: pulsa-fe/package-lock.json

      - name: Build backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/backend
          cd "$BACKEND_SOURCE_DIR"
          go mod download
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../deploy/backend/isiloka-api .

      - name: Build frontend standalone
        env:
          NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: "true"
          NEXT_PUBLIC_SITE_URL: https://isiloka.com
          NEXTAUTH_URL: https://isiloka.com
          API_BASE: http://127.0.0.1:8102
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRONTEND_SOURCE_DIR"
          npm ci
          npm run lint
          npm run build
          cd ..
          rm -rf deploy/frontend
          mkdir -p deploy/frontend/.next
          cp -R "$FRONTEND_SOURCE_DIR/.next/standalone/." deploy/frontend/
          cp -R "$FRONTEND_SOURCE_DIR/.next/static" deploy/frontend/.next/static
          cp -R "$FRONTEND_SOURCE_DIR/public" deploy/frontend/public
          printf '%s\n' "$GITHUB_SHA" > deploy/frontend/DEPLOY_COMMIT
          printf '%s\n' "$GITHUB_SHA" > deploy/frontend/public/deploy-version.txt

      - name: Upload release files
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/isiloka_deploy -p ${SERVER_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=ops/isiloka-known-hosts"

          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" \
            "set -e;
             mkdir -p \"${BACKEND_RELEASE_DIR}\";
             mkdir -p \"${FRONTEND_RELEASE_DIR}\""

          rsync -az --delete -e "ssh ${SSH_OPTS}" \
            deploy/frontend/ "${SERVER_USER}@${SERVER_HOST}:${FRONTEND_RELEASE_DIR}/"

          rsync -az -e "ssh ${SSH_OPTS}" \
            deploy/backend/isiloka-api "${SERVER_USER}@${SERVER_HOST}:${BACKEND_RELEASE_DIR}/isiloka-api"

      - name: Activate Isiloka and verify services
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/isiloka_deploy -p ${SERVER_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=ops/isiloka-known-hosts"
          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" \
            '/usr/local/sbin/isiloka-activate'

      - name: Verify public release
        shell: bash
        run: |
          set -euo pipefail
          actual=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://isiloka.com/deploy-version.txt?commit=${GITHUB_SHA}")
          test "$actual" = "$GITHUB_SHA"

      - name: Remove deployment key from runner
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/isiloka_deploy"
